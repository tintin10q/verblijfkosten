[project]
name = "verblijfkosten"
version = "0.1.0.post1"
description = "Easiliy calculate the optimal number of dinners, lunches, breakfast and hours you need to declare to get your verblijfkosten back."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=6.21.1",
    "python-constraint2>=2.7.3",
]
authors = [{name = "Quinten Cabo", email = "q.m.j.cabo@liacs.leidenuniv.nl"}]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://git.liacs.nl/caboqmj1/verblijfkosten"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["verblijfkosten.py", 'tarieflijst-verblijfkosten-buitenlandse-dienstreizen.pdf', 'tarieflijst-verblijfkosten-buitenlandse-dienstreizen.pdf.http.json', 'verblijfkosten-tarieven.toml']

[project.scripts]
verblijfkosten = "verblijfkosten:main"
